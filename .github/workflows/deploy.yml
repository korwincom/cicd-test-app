name: CI/CD Build and Push

on:
  push:
    branches: [ "main" ] # 필요에 따라 원하는 브랜치 추가 가능

env:
  APP_NAME: cicd-test-app
  DOCKER_IMAGE: legend03/cicd-test-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Java application with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Image Tag
        id: image_tag
        run: |
          # 한국 시간(KST, UTC+9) 기준 날짜 및 시간 생성
          DATE_TIME=$(TZ=Asia/Seoul date +'%y%m%d.%H%M')
          # Short Commit Hash
          HASH=$(git rev-parse --short HEAD)
          # 브랜치명 (refs/heads/main -> main)
          BRANCH=${GITHUB_REF_NAME}
          
          # 최종 태그 조합 (예: v260727.0909-94fef09-main)
          TAG_NAME="v${DATE_TIME}-${HASH}-${BRANCH}"
          
          echo "IMAGE_TAG=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Tag: ${TAG_NAME}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.image_tag.outputs.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest


      # ------------------------------------------------------------------
      # 🔥 [추가된 부분] k8s-manifests/deployment.yaml 자동 업데이트 & Commit
      # ------------------------------------------------------------------
      - name: Update k8s deployment manifest & Push
        run: |
          FULL_IMAGE="${{ env.DOCKER_IMAGE }}:${{ steps.image_tag.outputs.IMAGE_TAG }}"
          MANIFEST_FILE="k8s-manifests/deployment.yaml"
          
          # 1. yq 도구를 사용해 deployment.yaml 파일의 image 태그 수정
          # (yq는 YAML 구조를 유지하면서 값만 깔끔하게 변경해주는 전용 도구입니다)
          yq -i ".spec.template.spec.containers[0].image = \"${FULL_IMAGE}\"" ${MANIFEST_FILE}
          
          # 2. Git 사용자 정보 설정
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. 변경 사항 커밋 및 푸시
          git add ${MANIFEST_FILE}
          git commit -m "chore: update deployment image to ${FULL_IMAGE} [skip ci]"
          git push            
